name: Generate Contribution Snake

on:
  schedule:
    # Runs daily at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Umer1444
          outputs: |
            dist/github-snake-dark.svg?color_snake=#ff4fd8&color_dots=#2a1640,#8b3bff,#a855f7,#ff4fd8,#ff8ae2
            dist/github-snake-light.svg?color_snake=#d6249f&color_dots=#f6e9ff,#c9a4ff,#9d5cf5,#eb5bc2,#d6249f&color_dot_border=#00000000
            dist/github-snake.gif?color_snake=#ff4fd8&color_dots=#2a1640,#8b3bff,#a855f7,#ff4fd8,#ff8ae2

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
